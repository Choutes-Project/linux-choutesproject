# Choutes Project kernel: settings shared by every build (read by linux-tkg as _EXT_CONFIG_PATH).
# Every value is set, so that the build never stops to ask a question.
_distro="Arch"
_NUKR="true"
_git_mirror="kernel.org"
_force_all_threads="true"
_noccache="true"
_kernel_on_diet="false"
_modprobeddb="false"
_menunconfig="false"
_diffconfig="false"
_configfile=""
_config_updating="olddefconfig"
_rustdisable="false"
_debugdisable="false"
_STRIP="true"

# Scheduler and responsiveness: EEVDF (the kernel's own scheduler), 1000 Hz, full preemption.
_cpusched="eevdf"
_timer_freq="1000"
_preempt_rt="0"
_preempt_rt_force="0"
_tickless="2"
_sched_yield_type="0"
_rr_interval="default"
_smt_nice="true"
_runqueue_sharing="smt"
_irq_threading="false"

# Compiler: Clang with ThinLTO and -O3.
_compiler="llvm"
_llvm_ias="1"
_llvm_polly="0"
_lto_mode="thin"
KCFLAGS=""
KCPPFLAGS=""
KRUSTFLAGS=""

# Kept as the kernel has them: tracing (needed by sched-ext), NUMA, ACS off, no RGB patch.
_ftracedisable="false"
_numadisable="false"
_acs_override="false"
_openrgb="false"

# linux-tkg patch sets (reviewed for all users, see README.md).
_misc_adds="true"
_glitched_base="true"
_zenify="true"
_clear_patches="true"
_mglru="true"
_fsync_backport="true"
_fsync_legacy="true"
_fsync_futex2="false"
_zfsfix="true"
_ntsync="false"            # NTsync is part of the kernel since 6.14 (module ntsync)

# Defaults that suit desktops and laptops alike.
_default_cpu_gov=""        # schedutil, the kernel default
_aggressive_ondemand="false"
_tcp_cong_alg="bbr"        # BBR (v1, as in mainline); not BBRv3
_custom_commandline=""
_random_trust_cpu="false"  # the kernel default; the CPU is not trusted alone to seed the random generator
_NR_CPUS_value=""          # the default (320); never the cores of the build machine

# Choutes Project changes come only as patches and config fragments next to the PKGBUILD.
_community_patches=""
_user_patches="true"
_user_patches_no_confirm="true"
_config_fragments="true"
_config_fragments_no_confirm="true"
_vanilla=""
_offline=""
_kernel_localversion=""
_install_after_building="no"
_logging_use_script="no"
