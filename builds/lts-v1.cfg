# linux-choutesproject-lts, build for every x86-64 processor (x86-64-v1). Long-term series 6.18.
# This build is also the kernel of the installation image, so that it starts on every PC.
_custom_pkgbase="linux-choutesproject-lts"
_version="6.18-latest"
_processor_opt="x86-64"

# -O2 for the long-term series: Clang -O3 makes the link of 6.18 fail (__read_overflow in drm/gud,
# a false alarm of FORTIFY_SOURCE), and this kernel is above all the stable one for every computer.
_compileroptlevel="1"
